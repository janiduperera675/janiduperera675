<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="20" viewBox="0 0 1000 20">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a00" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#ff6a00"/>
      <stop offset="0.5" stop-color="#ffb347"/>
      <stop offset="0.75" stop-color="#ff6a00"/>
      <stop offset="1" stop-color="#ff6a00" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" gradientUnits="userSpaceOnUse" x1="-220" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd9a8" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        from="0 0" to="1220 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-400%" width="120%" height="900%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- base glow, gently breathing -->
  <rect x="0" y="8" width="1000" height="4" fill="url(#g)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <!-- base line -->
  <rect x="0" y="9.5" width="1000" height="1.5" fill="url(#g)"/>

  <!-- trailing light pulse -->
  <rect x="0" y="8.5" width="1000" height="3" fill="url(#pulse)" filter="url(#glow)"/>
  <rect x="0" y="9.5" width="1000" height="1.5" fill="url(#pulse)"/>

  <!-- travelling dot: halo + core, leads the pulse -->
  <circle cy="10" r="7" fill="#ff8c00" opacity="0.45" filter="url(#glow)">
    <animate attributeName="cx" from="0" to="1220" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cy="10" r="3.2" fill="#fff3e0">
    <animate attributeName="cx" from="0" to="1220" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
