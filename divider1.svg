<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 16" width="1200" height="16">
  <defs>
    <linearGradient id="blue" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#0a4dff"/>
      <stop offset="0.5" stop-color="#00cfff"/>
      <stop offset="1" stop-color="#0a4dff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1200 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.88" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="edge"><rect width="1200" height="16" fill="url(#fade)"/></mask>
    <filter id="soft" x="-5%" y="-400%" width="110%" height="900%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g mask="url(#edge)">
    <rect x="0" y="7" width="1200" height="2" rx="1" fill="url(#blue)" filter="url(#soft)"/>
    <circle r="2.5" cy="8" fill="#bff3ff" filter="url(#soft)" opacity="0.9">
      <animate attributeName="cx" values="20;1180;20" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
