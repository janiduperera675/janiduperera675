<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a63"/>
      <stop offset="0.45" stop-color="#a24a5e"/>
      <stop offset="0.8" stop-color="#e98a55"/>
      <stop offset="1" stop-color="#f4b36a"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e98a55"/>
      <stop offset="1" stop-color="#6b3566"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff2c4" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#ffc47a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff9a5a" stop-opacity="0"/>
    </radialGradient>
    <g id="pine">
      <polygon points="0,-110 18,-72 -18,-72"/>
      <polygon points="0,-90 24,-48 -24,-48"/>
      <polygon points="0,-66 30,-20 -30,-20"/>
      <rect x="-4" y="-20" width="8" height="20"/>
    </g>
    <clipPath id="frame"><rect width="900" height="300" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="300" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#fff">
      <circle cx="80" cy="30" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="190" cy="55" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="22" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="40" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="25" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="45" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="28" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="70" r="1.1"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- sun + pulsing glow -->
    <circle cx="610" cy="140" r="90" fill="url(#glow)">
      <animate attributeName="r" values="80;105;80" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="610" cy="140" r="26" fill="#fff0b8"/>

    <!-- drifting clouds -->
    <g fill="#ffd9a8" opacity="0.45">
      <ellipse cx="0" cy="70" rx="50" ry="9"><animate attributeName="cx" values="-60;960" dur="60s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="0" cy="100" rx="70" ry="10"><animate attributeName="cx" values="-100;1000" dur="85s" repeatCount="indefinite"/></ellipse>
    </g>

    <!-- birds -->
    <g stroke="#2a1638" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M0 0 q6 -6 12 0 q6 -6 12 0">
        <animateTransform attributeName="transform" type="translate" values="-30,60;930,40" dur="28s" repeatCount="indefinite"/>
      </path>
      <path d="M0 0 q5 -5 10 0 q5 -5 10 0">
        <animateTransform attributeName="transform" type="translate" values="-80,85;930,65" dur="34s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- mountains -->
    <path d="M0 200 L90 130 L170 185 L270 105 L380 190 L470 140 L580 195 L700 120 L810 185 L900 145 L900 230 L0 230 Z" fill="#7a3e63"/>
    <path d="M0 220 L110 160 L210 215 L330 150 L450 220 L560 170 L680 220 L790 160 L900 215 L900 250 L0 250 Z" fill="#5a2d57"/>

    <!-- lake -->
    <rect x="0" y="215" width="900" height="60" fill="url(#lake)"/>
    <g stroke="#ffe3b0" stroke-width="2" stroke-linecap="round" opacity="0.5">
      <line x1="570" y1="228" x2="650" y2="228"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="3s" repeatCount="indefinite"/></line>
      <line x1="585" y1="238" x2="640" y2="238"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="3s" repeatCount="indefinite"/></line>
      <line x1="595" y1="248" x2="630" y2="248"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="2.4s" repeatCount="indefinite"/></line>
    </g>

    <!-- back trees -->
    <g fill="#3a2049">
      <use href="#pine" transform="translate(300,238) scale(0.8)"/>
      <use href="#pine" transform="translate(340,242) scale(0.6)"/>
      <use href="#pine" transform="translate(770,240) scale(0.7)"/>
    </g>

    <!-- foreground ground -->
    <path d="M0 270 Q200 252 450 266 T900 262 L900 300 L0 300 Z" fill="#1b0f26"/>

    <!-- foreground trees (swaying) -->
    <g fill="#1b0f26">
      <g transform="translate(55,285)">
        <g><animateTransform attributeName="transform" type="rotate" values="-1.2;1.2;-1.2" dur="6s" repeatCount="indefinite"/>
          <use href="#pine" transform="scale(1.7)"/></g>
      </g>
      <g transform="translate(135,290)">
        <g><animateTransform attributeName="transform" type="rotate" values="1;-1;1" dur="5s" repeatCount="indefinite"/>
          <use href="#pine" transform="scale(1.3)"/></g>
      </g>
      <g transform="translate(845,288)">
        <g><animateTransform attributeName="transform" type="rotate" values="-1;1;-1" dur="5.5s" repeatCount="indefinite"/>
          <use href="#pine" transform="scale(1.8)"/></g>
      </g>
      <g transform="translate(765,292)">
        <g><animateTransform attributeName="transform" type="rotate" values="1.2;-1.2;1.2" dur="6.5s" repeatCount="indefinite"/>
          <use href="#pine" transform="scale(1.35)"/></g>
      </g>
    </g>

    <!-- walking deer -->
    <g transform="translate(0,268)">
      <animateTransform attributeName="transform" type="translate" values="-80,268;980,268" dur="32s" repeatCount="indefinite"/>
      <g fill="#1b0f26" stroke="#1b0f26">
        <!-- body bob -->
        <g>
          <animateTransform attributeName="transform" type="translate" values="0,0;0,-2;0,0" dur="0.8s" repeatCount="indefinite"/>
          <ellipse cx="0" cy="-40" rx="27" ry="12" stroke="none"/>
          <path d="M14 -46 L30 -76 L38 -72 L26 -42 Z" stroke="none"/>
          <ellipse cx="40" cy="-77" rx="10" ry="6" transform="rotate(-20 40 -77)" stroke="none"/>
          <path d="M-26 -44 L-33 -50 L-28 -38 Z" stroke="none"/>
          <!-- antlers -->
          <path d="M36 -82 L34 -98 M34 -92 L26 -100 M34 -98 L38 -108 M40 -82 L44 -98 M44 -94 L52 -100 M44 -98 L42 -108" fill="none" stroke-width="2" stroke-linecap="round"/>
        </g>
        <!-- legs: swing from hip -->
        <g transform="translate(18,-32)">
          <line x1="0" y1="0" x2="0" y2="32" stroke-width="4" stroke-linecap="round">
            <animateTransform attributeName="transform" type="rotate" values="-24;24;-24" dur="1.2s" repeatCount="indefinite"/>
          </line>
        </g>
        <g transform="translate(10,-32)">
          <line x1="0" y1="0" x2="0" y2="32" stroke-width="4" stroke-linecap="round">
            <animateTransform attributeName="transform" type="rotate" values="24;-24;24" dur="1.2s" repeatCount="indefinite"/>
          </line>
        </g>
        <g transform="translate(-14,-32)">
          <line x1="0" y1="0" x2="0" y2="32" stroke-width="4" stroke-linecap="round">
            <animateTransform attributeName="transform" type="rotate" values="24;-24;24" dur="1.2s" repeatCount="indefinite"/>
          </line>
        </g>
        <g transform="translate(-22,-32)">
          <line x1="0" y1="0" x2="0" y2="32" stroke-width="4" stroke-linecap="round">
            <animateTransform attributeName="transform" type="rotate" values="-24;24;-24" dur="1.2s" repeatCount="indefinite"/>
          </line>
        </g>
      </g>
    </g>

    <!-- fireflies -->
    <g fill="#ffe89a">
      <circle cx="220" cy="245" r="2"><animate attributeName="cy" values="245;225;245" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="250" r="2"><animate attributeName="cy" values="250;228;250" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="248" r="2"><animate attributeName="cy" values="248;226;248" dur="3.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- text -->
    <g font-family="'Courier New', Courier, monospace" font-weight="bold" text-anchor="middle" fill="#fff">
      <text x="400" y="128" font-size="30">
        <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze"/>
        Hi, I'm Janidu
      </text>
      <text x="400" y="172" font-size="22">
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4;1" dur="2.5s" fill="freeze"/>
        A Software Engineer in making
      </text>
    </g>
    <rect x="655" y="152" width="10" height="24" fill="#fff">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
